name: Windows desktop app

# Builds the AgnView Windows desktop app with tools/build-windows.ps1 and
# attaches AgnView-windows-x64.zip to the GitHub release of each v* tag.
# To attach the zip to an existing release, run this workflow by hand and
# enter the tag, for example v0.1.11.

on:
  push:
    tags: ["v*"]
    branches: ["bot/fix-windows-motw"] # TEMP dry run
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to, for example v0.1.11
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build, verify and attach the zip
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            tag="v0.1.13" # TEMP dry run
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$'; then
            echo "The tag is not a version tag like v0.1.11." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_type == 'branch' && github.sha || format('refs/tags/{0}', steps.tag.outputs.tag) }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The script builds dist\AgnView\ with PyInstaller and packs
      # dist\AgnView-windows-x64.zip. It installs nothing without -Install.
      - name: Build
        shell: pwsh
        run: ./tools/build-windows.ps1

      - name: Verify the zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "dist/AgnView-windows-x64.zip"
          $size = (Get-Item $zip).Length
          Write-Host ("Zip size: {0:N1} MB" -f ($size / 1MB))
          if ($size -lt 20MB -or $size -gt 600MB) { throw "Zip size $size bytes is outside the expected range." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName.Replace([string][char]92, '/') }
          } finally { $archive.Dispose() }
          Write-Host ("Entries: {0}" -f $names.Count)
          $names | Select-Object -First 15 | ForEach-Object { Write-Host "  $_" }
          if ($names -notcontains "AgnView/AgnView.exe") { throw "AgnView/AgnView.exe is not at the top of the zip." }
          $outside = $names | Where-Object { -not $_.StartsWith("AgnView/") }
          if ($outside) { throw "Entries outside the AgnView folder: $outside" }
          if (-not ($names | Where-Object { $_ -like "AgnView/_internal/*" })) { throw "The support files are missing." }

      # The app is windowed, so it has no console and no version flag. Start it
      # minimised on a loopback port, read the version from the hub's OpenAPI
      # document and compare it with pyproject.toml, then stop it. The tray
      # and the window are not exercised.
      - name: Smoke test the extracted app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:RUNNER_TEMP "smoke"
          Expand-Archive -Path dist/AgnView-windows-x64.zip -DestinationPath $dest
          $exe = Join-Path $dest "AgnView/AgnView.exe"
          if (-not (Test-Path $exe)) { throw "AgnView.exe is missing after extraction." }
          $expected = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $port = Get-Random -Minimum 20000 -Maximum 40000
          $proc = Start-Process -FilePath $exe -ArgumentList "--minimized", "--port", $port -PassThru
          try {
            $version = $null
            for ($i = 0; $i -lt 60 -and -not $version; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "AgnView exited early with code $($proc.ExitCode)." }
              try {
                $version = (Invoke-RestMethod "http://127.0.0.1:$port/openapi.json" -TimeoutSec 3).info.version
              } catch { $version = $null }
            }
            if (-not $version) { throw "The hub did not answer on loopback within 60 seconds." }
            Write-Host "Hub answered with version $version, expected $expected."
            if ($version -ne $expected) { throw "Version mismatch." }
          } finally {
            Get-Process AgnView -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      # A zip downloaded in a browser leaves a Zone.Identifier stream (the
      # download mark, ZoneId=3) on every file it extracts. The .NET runtime
      # refuses to load a marked pythonnet or WebView2 assembly, and before
      # the app cleared its own mark the window failed with "Failed to resolve
      # Python.Runtime.Loader.Initialize". This step extracts the built zip,
      # marks every file the way a browser does, and starts the exe with
      # CreateProcess, which is what a double-click does after the security
      # warning is accepted. The app must come up with the built version, the
      # log must show no loader error, and no file may still carry the mark.
      # A second start with only pythonnet and a WebView2 assembly marked
      # again, as after extracting a zip over an existing install, must clear
      # them too.
      - name: Smoke test a zip downloaded in a browser
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $root = Join-Path $env:RUNNER_TEMP "browser-download"
          Expand-Archive -Path dist/AgnView-windows-x64.zip -DestinationPath $root
          $app = Join-Path $root "AgnView"
          $exe = Join-Path $app "AgnView.exe"
          $runtime = Join-Path $app "_internal/pythonnet/runtime/Python.Runtime.dll"

          $data = Join-Path $env:USERPROFILE ".agnview"
          $recordPath = Join-Path $data "desktop-instance.json"
          $logPath = Join-Path $data "logs/desktop.log"
          function Read-Json($path) { try { Get-Content $path -Raw | ConvertFrom-Json } catch { $null } }
          function Get-Answer($port) {
            if (-not $port) { return $null }
            try { (Invoke-RestMethod "http://127.0.0.1:$port/openapi.json" -TimeoutSec 3).info.version } catch { $null }
          }
          function Set-Mark($path) {
            Set-Content -Path $path -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          function Get-MarkedFiles { Get-ChildItem $app -Recurse -File | Where-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue } }
          function Start-Like-DoubleClick {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.WorkingDirectory = $app
            $psi.UseShellExecute = $false
            [System.Diagnostics.Process]::Start($psi)
          }
          function Fail($message) {
            Write-Host "::group::Diagnostics"
            Write-Host "Files still marked: $(@(Get-MarkedFiles).Count)"
            Write-Host "Last lines of desktop.log:"
            if (Test-Path $logPath) { Get-Content $logPath -Tail 40 | Write-Host } else { Write-Host "  none" }
            Write-Host "::endgroup::"
            throw $message
          }
          function Test-Start($label) {
            Get-Process AgnView -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            Remove-Item $recordPath, $logPath -Force -ErrorAction SilentlyContinue
            $proc = Start-Like-DoubleClick
            $answer = $null
            for ($i = 0; $i -lt 90 -and $answer -ne $expected; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { Fail "${label}: AgnView exited early with code $($proc.ExitCode)." }
              $record = Read-Json $recordPath
              if ($record -and $record.port) { $answer = Get-Answer ([int]$record.port) }
            }
            if ($answer -ne $expected) { Fail "${label}: the hub answered '$answer', expected $expected." }
            # The window opens after the hub answers, so give a loader failure
            # time to show up before the log is read.
            Start-Sleep -Seconds 15
            if ($proc.HasExited) { Fail "${label}: AgnView exited with code $($proc.ExitCode) after it started." }
            $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { "" }
            if ($log -match "Failed to resolve|clr_loader|The AgnView window stopped|NotSupportedException") { Fail "${label}: the log shows a window or loader error." }
            $left = @(Get-MarkedFiles)
            if ($left.Count) { Fail "${label}: $($left.Count) files still carry the download mark." }
            Write-Host "${label}: version $answer answers, the log is clean and no file carries the mark."
          }

          try {
            $files = @(Get-ChildItem $app -Recurse -File)
            foreach ($f in $files) { Set-Mark $f.FullName }
            $count = @(Get-MarkedFiles).Count
            Write-Host "Marked $count of $($files.Count) files the way a browser download does."
            if ($count -ne $files.Count) { throw "Not every file was marked." }
            $stream = (Get-Content -Path $runtime -Stream Zone.Identifier) -join "|"
            if ($stream -ne "[ZoneTransfer]|ZoneId=3") { throw "Python.Runtime.dll carries '$stream', not the download mark." }

            Test-Start "Marked download"

            Set-Mark $runtime
            Set-Mark (Join-Path $app "_internal/webview/lib/Microsoft.Web.WebView2.Core.dll")
            Test-Start "Marked again"
          } finally {
            Get-Process AgnView -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      # A person updates by starting the new AgnView.exe while the previous
      # release runs. The new copy must close the old one and answer on the
      # same port, and it must keep running.
      #
      # The port is not fixed. The step before this one starts the app with a
      # random port, and the app saves that port for later starts, so the older
      # release binds the saved port and not 18845. This step therefore reads
      # the port from the record each copy writes (desktop-instance.json) and
      # checks that the version in the record matches the version that answers.
      - name: Smoke test an update over a running older release
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $expected = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $building = [version]$env:TAG.TrimStart("v")
          # The older release is the newest plain release with a lower version
          # than the tag being built. Versions are compared as numbers.
          $previous = gh release list --limit 50 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -match '^v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -lt $building -and [version]$Matches[1] -ge [version]"0.1.8" } |
            Sort-Object { [version]($_.TrimStart("v")) } -Descending | Select-Object -First 1
          if (-not $previous) { Write-Host "No earlier release with the handoff to test against."; exit 0 }
          $oldVersion = $previous.TrimStart("v")
          Write-Host "Updating from $oldVersion to $expected."
          $old = Join-Path $env:RUNNER_TEMP "old"
          gh release download $previous -p AgnView-windows-x64.zip -D $old
          Expand-Archive -Path (Join-Path $old "AgnView-windows-x64.zip") -DestinationPath (Join-Path $old "x")
          $new = Join-Path $env:RUNNER_TEMP "update"
          Expand-Archive -Path dist/AgnView-windows-x64.zip -DestinationPath $new

          $data = Join-Path $env:USERPROFILE ".agnview"
          $recordPath = Join-Path $data "desktop-instance.json"
          $logPath = Join-Path $data "logs/desktop.log"
          function Read-Json($path) { try { Get-Content $path -Raw | ConvertFrom-Json } catch { $null } }
          function Get-Answer($port) {
            if (-not $port) { return $null }
            try { (Invoke-RestMethod "http://127.0.0.1:$port/openapi.json" -TimeoutSec 3).info.version } catch { $null }
          }
          function Fail($message) {
            Write-Host "::group::Diagnostics"
            Write-Host "Running copies of the app:"
            Get-Process AgnView -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  pid {0}, started {1}, {2}" -f $_.Id, $_.StartTime, $_.Path) }
            $ids = @(Get-Process AgnView -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
            if ($ids.Count) {
              try {
                Get-NetTCPConnection -State Listen -ErrorAction Stop | Where-Object { $ids -contains $_.OwningProcess } |
                  ForEach-Object { Write-Host ("  listening on {0}:{1} (pid {2})" -f $_.LocalAddress, $_.LocalPort, $_.OwningProcess) }
              } catch { Write-Host "  listening ports are not available: $($_.Exception.Message)" }
            }
            Write-Host "Instance record:"
            if (Test-Path $recordPath) { Get-Content $recordPath -Raw | Write-Host } else { Write-Host "  none" }
            Write-Host "Saved settings:"
            $settingsPath = Join-Path $data "desktop.json"
            if (Test-Path $settingsPath) { Get-Content $settingsPath -Raw | Write-Host } else { Write-Host "  none" }
            Write-Host "Last lines of desktop.log:"
            if (Test-Path $logPath) { Get-Content $logPath -Tail 40 | Write-Host } else { Write-Host "  none" }
            Write-Host "::endgroup::"
            throw $message
          }

          try {
            # Start from a clean record and log. The saved settings stay, as
            # they do on a real machine.
            Get-Process AgnView -ErrorAction SilentlyContinue | Stop-Process -Force
            Remove-Item $recordPath, $logPath -Force -ErrorAction SilentlyContinue

            # Start the older release the way a double-click does, with no arguments.
            $oldProc = Start-Process (Join-Path $old "x/AgnView/AgnView.exe") -PassThru
            $port = $null
            $answer = $null
            for ($i = 0; $i -lt 90 -and $answer -ne $oldVersion; $i++) {
              Start-Sleep -Seconds 1
              if ($oldProc.HasExited) { Fail "The older release $oldVersion exited with code $($oldProc.ExitCode) before it answered." }
              $record = Read-Json $recordPath
              if ($record -and $record.version -eq $oldVersion -and $record.port) {
                $port = [int]$record.port
                $answer = Get-Answer $port
              }
            }
            if ($answer -ne $oldVersion) { Fail "The older release $oldVersion did not answer with its version on port '$port' (last answer '$answer')." }
            Write-Host "Older release $oldVersion (pid $($oldProc.Id)) answers on port $port."

            # Start the new build the same way. It must close the old copy and
            # answer on the same port with the new version.
            $proc = Start-Process (Join-Path $new "AgnView/AgnView.exe") -PassThru
            $answer = $null
            for ($i = 0; $i -lt 90 -and $answer -ne $expected; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { Fail "The new copy exited with code $($proc.ExitCode) instead of taking over." }
              $answer = Get-Answer $port
            }
            if ($answer -ne $expected) { Fail "After the update port $port answers with '$answer', expected $expected." }
            $record = Read-Json $recordPath
            if (-not $record -or $record.version -ne $expected -or $record.pid -ne $proc.Id) {
              Fail "The instance record does not name the new copy (pid $($proc.Id), version $expected)."
            }
            for ($i = 0; $i -lt 30 -and -not $oldProc.HasExited; $i++) { Start-Sleep -Seconds 1 }
            if (-not $oldProc.HasExited) { Fail "The older release (pid $($oldProc.Id)) is still running after the update." }
            Write-Host "New copy $expected (pid $($proc.Id)) answers on port $port and the older copy is gone."

            Start-Sleep -Seconds 15
            if ($proc.HasExited) { Fail "The new copy exited with code $($proc.ExitCode) after it started." }
            if ((Get-Answer $port) -ne $expected) { Fail "The hub stopped answering after the update." }
            Write-Host "The update took over from $oldVersion and $expected keeps running."
          } finally {
            Get-Process AgnView -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Checksum
        id: sum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AgnView-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          "## AgnView-windows-x64.zip`n`nSHA-256: ``$hash```n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # Creates the release only when the macOS or PyPI workflow has not yet.
      # Uploads only this workflow's file, so other assets stay untouched.
      - name: Attach AgnView-windows-x64.zip
        if: ${{ github.ref_type != 'branch' }} # TEMP dry run
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "AgnView ${TAG#v}" --notes "AgnView ${TAG#v}" \
              || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" dist/AgnView-windows-x64.zip --clobber
